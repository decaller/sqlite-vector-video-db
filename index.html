<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKN VideoDB — Semantic Vector Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .result-card { background: #161b22; border: 1px solid #30363d; }
        mark { background: #d29922; color: #0d1117; padding: 0 2px; border-radius: 2px; }
    </style>
</head>
<body class="p-6 max-w-4xl mx-auto">
    <header class="mb-8">
        <h1 class="text-3xl font-bold text-blue-400 mb-2">🎓 PKN VideoDB</h1>
        <p class="text-gray-400">Ceramah Parenting Islam — Powered by <code>sqlite-vector</code> & <code>Transformers.js</code></p>
    </header>

    <div id="status" class="mb-4 p-3 rounded text-sm bg-blue-900/30 border border-blue-700 text-blue-400 flex justify-between items-center cursor-pointer" id="initBox">
        <span id="statusText">Click here or start typing to enable AI Search</span>
        <span id="modelStatus" class="opacity-70 text-xs"></span>
    </div>

    <div class="flex flex-col md:flex-row gap-4 mb-6">
        <input type="text" id="query" placeholder="Tanya apa saja... (misal: cara mendisiplinkan anak tanpa marah)" 
               class="flex-1 bg-[#161b22] border border-[#30363d] rounded-md px-4 py-2 focus:outline-none focus:border-blue-500">
        
        <select id="searchMode" class="bg-[#161b22] border border-[#30363d] rounded-md px-4 py-2 focus:outline-none">
            <option value="vector">Semantic Search (AI)</option>
            <option value="fts">Keyword Search (FTS)</option>
        </select>

        <button id="searchBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-md transition disabled:opacity-50">
            Search
        </button>
    </div>

    <div id="stats" class="text-sm text-gray-500 mb-4"></div>

    <div id="results" class="space-y-4">
        <!-- Results will appear here -->
    </div>

    <script type="module">
        import initSqlite from 'https://esm.sh/@sqliteai/sqlite-wasm';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        // Configure transformers.js to cache the model in the browser
        env.allowLocalModels = false;

        let db = null;
        let extractor = null;
        let isInitializing = false;
        
        const statusEl = document.getElementById('status');
        const statusTextEl = document.getElementById('statusText');
        const modelStatusEl = document.getElementById('modelStatus');
        const queryEl = document.getElementById('query');
        const btnEl = document.getElementById('searchBtn');
        const resultsEl = document.getElementById('results');
        const statsEl = document.getElementById('stats');
        const modeEl = document.getElementById('searchMode');

        async function ensureInitialized() {
            if (db && (modeEl.value === 'fts' || extractor)) return true;
            if (isInitializing) return false;
            isInitializing = true;

            try {
                // 1. Initialize SQLite if not ready
                if (!db) {
                    statusTextEl.textContent = 'Loading Database...';
                    const sqlite3 = await initSqlite();
                    const resp = await fetch('pkn.db');
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const buf = await resp.arrayBuffer();
                    
                    db = new sqlite3.oo1.DB('pkn.db', 'c');
                    const data = new Uint8Array(buf);
                    const p = sqlite3.wasm.alloc(data.length);
                    sqlite3.wasm.heap8u().set(data, p);
                    sqlite3.capi.sqlite3_deserialize(db.pointer, 'main', p, data.length, data.length, 0x01);
                    db.exec("SELECT vector_init('chapters', 'embedding', 'dimension=384,distance=l2')");
                }

                // 2. Initialize Model if Semantic mode selected
                if (modeEl.value === 'vector' && !extractor) {
                    statusTextEl.textContent = 'Loading AI Model (MiniLM)...';
                    extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', {
                        progress_callback: (p) => {
                            if (p.status === 'progress') {
                                modelStatusEl.textContent = `${p.file}: ${p.loaded.toFixed(1)}%`;
                            }
                        }
                    });
                }

                statusEl.className = 'mb-4 p-3 rounded text-sm bg-green-900/30 border border-green-700 text-green-500 flex justify-between items-center';
                statusTextEl.textContent = 'Ready!';
                if (extractor) modelStatusEl.textContent = 'AI Model Loaded';
                
                queryEl.disabled = false;
                btnEl.disabled = false;
                isInitializing = false;
                return true;
            } catch (err) {
                statusEl.className = 'mb-4 p-3 rounded text-sm bg-red-900/30 border border-red-700 text-red-500';
                statusTextEl.textContent = 'Error: ' + err.message;
                console.error(err);
                isInitializing = false;
                return false;
            }
        }

        // Trick B: Semantic Highlighting using token-level similarity
        async function highlightSemantically(queryVector, text) {
            if (!extractor || !text) return text;
            
            const output = await extractor(text, { pooling: 'none' });
            const tokenVectors = output.data; 
            const seqLen = output.dims[1];
            const dim = output.dims[2];

            const { input_ids } = await extractor.tokenizer(text);
            const tokens = input_ids.data;

            const scores = new Float32Array(seqLen);
            for (let i = 0; i < seqLen; i++) {
                let dot = 0;
                for (let d = 0; d < dim; d++) {
                    dot += tokenVectors[i * dim + d] * queryVector[d];
                }
                scores[i] = dot;
            }

            const threshold = 0.45; // Slightly higher for word-level
            let resultHtml = '';
            let wordBuffer = [];
            
            const flushBuffer = () => {
                if (wordBuffer.length === 0) return;
                
                const wordText = wordBuffer.map(b => b.text).join('');
                const maxScore = Math.max(...wordBuffer.map(b => b.score));
                
                // Only highlight if it contains at least one letter or number
                const hasAlphanumeric = /[a-zA-Z0-9]/.test(wordText);

                if (maxScore > threshold && hasAlphanumeric) {
                    resultHtml += `<mark class="bg-blue-500/40 text-blue-100 px-0.5 rounded">${wordText}</mark>`;
                } else {
                    resultHtml += wordText;
                }
                wordBuffer = [];
            };

            for (let i = 0; i < tokens.length; i++) {
                const tokenId = tokens[i];
                if (tokenId === 101 || tokenId === 102) continue;

                let tokenText = extractor.tokenizer.decode([tokenId], { skip_special_tokens: true });
                if (!tokenText) continue;

                const isContinuation = tokenText.startsWith('##');
                
                if (!isContinuation && wordBuffer.length > 0) {
                    flushBuffer();
                    resultHtml += ' '; // Simple space separator
                }

                wordBuffer.push({
                    text: isContinuation ? tokenText.substring(2) : tokenText,
                    score: scores[i]
                });
            }
            flushBuffer();
            
            return resultHtml || text;
        }

        async function getVector(text) {
            const output = await extractor(text, { pooling: 'mean', normalize: true });
            return Array.from(output.data);
        }

        async function doSearch() {
            if (!(await ensureInitialized())) return;
            const q = queryEl.value.trim();
            if (!q) return;

            btnEl.disabled = true;
            resultsEl.innerHTML = '<div class="text-gray-500 italic">Thinking... (Analyzing Meaning)</div>';
            const mode = modeEl.value;
            const terms = q.split(/\s+/);

            try {
                let rows;
                let qVec = null;

                if (mode === 'vector') {
                    qVec = await getVector(q);
                    rows = db.exec({
                        sql: `
                            SELECT c.topic, c.start_time, c.summary, vid.url, c.start_seconds, vid.title, vec.distance, c.id
                            FROM chapters c
                            JOIN videos vid ON vid.id = c.video_id
                            JOIN vector_full_scan('chapters', 'embedding', vector_as_f32(?)) vec ON c.id = vec.rowid
                            ORDER BY vec.distance ASC
                            LIMIT 10
                        `,
                        bind: [JSON.stringify(qVec)],
                        returnValue: "resultRows"
                    });
                } else {
                    const ftsQuery = terms.map(t => `"${t}"`).join(' OR ');
                    rows = db.exec({
                        sql: `
                            SELECT c.topic, c.start_time, c.summary, vid.url, c.start_seconds, vid.title, 0 as distance, c.id
                            FROM chapters_fts
                            JOIN chapters c ON c.id = chapters_fts.rowid
                            JOIN videos vid ON vid.id = c.video_id
                            WHERE chapters_fts MATCH ?
                            ORDER BY rank
                            LIMIT 10
                        `,
                        bind: [ftsQuery],
                        returnValue: "resultRows"
                    });
                }

                resultsEl.innerHTML = '';
                if (rows.length === 0) {
                    resultsEl.innerHTML = '<div class="result-card p-4 rounded-md italic">No results found.</div>';
                } else {
                    for (const row of rows) {
                        const [topic, startTime, summary, url, startSec, vTitle, dist, id] = row;
                        const videoId = url.match(/v=([^&]+)/)?.[1] || '';
                        const watchUrl = `https://www.youtube.com/watch?v=${videoId}&t=${startSec}`;
                        
                        // Fix 1: Improved Match % logic (clipped 0-100)
                        // L2 distance on unit vectors ranges 0 to 2. 
                        // Similarity = 1 - (dist^2 / 2). 
                        const similarity = Math.max(0, 1 - (dist * dist) / 2);
                        const matchPct = (similarity * 100).toFixed(1);

                        // Fix 2: Semantic Highlighting (Trick B)
                        let displayTopic = topic;
                        let displaySummary = summary;
                        
                        if (mode === 'vector' && qVec) {
                            // Only highlight top 3 for performance
                            if (rows.indexOf(row) < 3) {
                                displayTopic = await highlightSemantically(qVec, topic);
                                displaySummary = await highlightSemantically(qVec, summary);
                            }
                        } else {
                            // Fallback to keyword highlight
                            const highlight = (s) => {
                                let out = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                                terms.forEach(t => {
                                    if (t.length < 2) return;
                                    const re = new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                                    out = out.replace(re, '<mark>$1</mark>');
                                });
                                return out;
                            };
                            displayTopic = highlight(topic);
                            displaySummary = highlight(summary);
                        }

                        const card = document.createElement('div');
                        card.className = 'result-card p-4 rounded-md shadow-sm';
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-blue-400 font-semibold text-lg">${displayTopic}</h3>
                                <span class="text-xs font-mono text-gray-500 bg-gray-800 px-2 py-1 rounded">${startTime}</span>
                            </div>
                            <p class="text-sm text-gray-300 mb-3">${displaySummary}</p>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500">${vTitle}</span>
                                <div class="flex gap-4">
                                    ${mode === 'vector' ? `<span class="text-green-600 font-mono">match: ${matchPct}%</span>` : ''}
                                    <a href="${watchUrl}" target="_blank" class="text-green-500 hover:underline">▶ Watch</a>
                                </div>
                            </div>
                        `;
                        resultsEl.appendChild(card);
                    }
                }

            } catch (err) {
                resultsEl.innerHTML = `<div class="p-4 bg-red-900/20 text-red-500 rounded border border-red-700">Error: ${err.message}</div>`;
            } finally {
                btnEl.disabled = false;
            }
        }

        queryEl.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
        btnEl.addEventListener('click', doSearch);
        statusEl.addEventListener('click', ensureInitialized);
        modeEl.addEventListener('change', () => { if(modeEl.value === 'vector') ensureInitialized(); });

        // Lazy init on first interaction
        queryEl.addEventListener('focus', ensureInitialized, { once: true });

        // Initial minimal init
        ensureInitialized();
    </script>
</body>
</html>
</body>
</html>
