<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKN VideoDB — Semantic Vector Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .result-card { background: #161b22; border: 1px solid #30363d; }
        mark { background: #d29922; color: #0d1117; padding: 0 2px; border-radius: 2px; }
    </style>
</head>
<body class="p-6 max-w-4xl mx-auto">
    <header class="mb-8">
        <h1 class="text-3xl font-bold text-blue-400 mb-2">🎓 PKN VideoDB</h1>
        <p class="text-gray-400">Ceramah Parenting Islam — Powered by <code>sqlite-vector</code> & <code>Transformers.js</code></p>
    </header>

    <div id="status" class="mb-4 p-3 rounded text-sm bg-yellow-900/30 border border-yellow-700 text-yellow-500 flex justify-between items-center">
        <span>Initializing...</span>
        <span id="modelStatus" class="opacity-70 text-xs"></span>
    </div>

    <div class="flex flex-col md:flex-row gap-4 mb-6">
        <input type="text" id="query" placeholder="Tanya apa saja... (misal: cara mendisiplinkan anak tanpa marah)" 
               class="flex-1 bg-[#161b22] border border-[#30363d] rounded-md px-4 py-2 focus:outline-none focus:border-blue-500" disabled>
        
        <select id="searchMode" class="bg-[#161b22] border border-[#30363d] rounded-md px-4 py-2 focus:outline-none">
            <option value="vector">Semantic Search (AI)</option>
            <option value="fts">Keyword Search (FTS)</option>
        </select>

        <button id="searchBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-md transition disabled:opacity-50" disabled>
            Search
        </button>
    </div>

    <div id="stats" class="text-sm text-gray-500 mb-4"></div>

    <div id="results" class="space-y-4">
        <!-- Results will appear here -->
    </div>

    <script type="module">
        import initSqlite from 'https://esm.sh/@sqliteai/sqlite-wasm';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        // Configure transformers.js to cache the model in the browser
        env.allowLocalModels = false;

        let db = null;
        let extractor = null;
        
        const statusEl = document.getElementById('status');
        const modelStatusEl = document.getElementById('modelStatus');
        const queryEl = document.getElementById('query');
        const btnEl = document.getElementById('searchBtn');
        const resultsEl = document.getElementById('results');
        const statsEl = document.getElementById('stats');
        const modeEl = document.getElementById('searchMode');

        async function init() {
            try {
                // 1. Initialize SQLite
                statusEl.querySelector('span').textContent = 'Loading Database...';
                const sqlite3 = await initSqlite();
                
                const resp = await fetch('pkn.db');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const buf = await resp.arrayBuffer();
                
                db = new sqlite3.oo1.DB('pkn.db', 'c');
                const data = new Uint8Array(buf);
                const p = sqlite3.wasm.alloc(data.length);
                sqlite3.wasm.heap8u().set(data, p);
                sqlite3.capi.sqlite3_deserialize(db.pointer, 'main', p, data.length, data.length, 0x01);

                const chapterCount = db.exec("SELECT COUNT(*) FROM chapters", {returnValue: "resultRows"})[0][0];
                db.exec("SELECT vector_init('chapters', 'embedding', 'dimension=384,distance=l2')");

                // 2. Initialize Model
                statusEl.querySelector('span').textContent = 'Loading AI Model (MiniLM)...';
                extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', {
                    progress_callback: (p) => {
                        if (p.status === 'progress') {
                            modelStatusEl.textContent = `${p.file}: ${p.loaded.toFixed(1)}%`;
                        }
                    }
                });

                statusEl.className = 'mb-4 p-3 rounded text-sm bg-green-900/30 border border-green-700 text-green-500 flex justify-between items-center';
                statusEl.querySelector('span').textContent = 'Ready!';
                modelStatusEl.textContent = 'AI Model Loaded';
                
                statsEl.textContent = `${chapterCount} chapters indexed semantic search ready.`;
                
                queryEl.disabled = false;
                btnEl.disabled = false;
                queryEl.focus();

            } catch (err) {
                statusEl.className = 'mb-4 p-3 rounded text-sm bg-red-900/30 border border-red-700 text-red-500';
                statusEl.querySelector('span').textContent = 'Error: ' + err.message;
                console.error(err);
            }
        }

        function highlight(text, terms) {
            if (!text) return '';
            let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            for (const t of terms) {
                if (!t || t.length < 2) continue;
                const re = new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                s = s.replace(re, '<mark>$1</mark>');
            }
            return s;
        }

        async function getVector(text) {
            const output = await extractor(text, { pooling: 'mean', normalize: true });
            return JSON.stringify(Array.from(output.data));
        }

        async function doSearch() {
            const q = queryEl.value.trim();
            if (!q || !db) return;

            btnEl.disabled = true;
            resultsEl.innerHTML = '<div class="text-gray-500 italic">Thinking... (Computing Vector)</div>';
            const mode = modeEl.value;
            const terms = q.split(/\s+/);

            try {
                let rows;
                if (mode === 'vector') {
                    const vecJson = await getVector(q);
                    rows = db.exec({
                        sql: `
                            SELECT c.topic, c.start_time, c.summary, vid.url, c.start_seconds, vid.title, vec.distance
                            FROM chapters c
                            JOIN videos vid ON vid.id = c.video_id
                            JOIN vector_full_scan('chapters', 'embedding', vector_as_f32(?)) vec ON c.id = vec.rowid
                            ORDER BY vec.distance ASC
                            LIMIT 10
                        `,
                        bind: [vecJson],
                        returnValue: "resultRows"
                    });
                } else {
                    const ftsQuery = terms.map(t => `"${t}"`).join(' OR ');
                    rows = db.exec({
                        sql: `
                            SELECT c.topic, c.start_time, c.summary, vid.url, c.start_seconds, vid.title, 0 as distance
                            FROM chapters_fts
                            JOIN chapters c ON c.id = chapters_fts.rowid
                            JOIN videos vid ON vid.id = c.video_id
                            WHERE chapters_fts MATCH ?
                            ORDER BY rank
                            LIMIT 10
                        `,
                        bind: [ftsQuery],
                        returnValue: "resultRows"
                    });
                }

                resultsEl.innerHTML = '';
                if (rows.length === 0) {
                    resultsEl.innerHTML = '<div class="result-card p-4 rounded-md italic">No results found.</div>';
                } else {
                    rows.forEach(row => {
                        const [topic, startTime, summary, url, startSec, vTitle, dist] = row;
                        const videoId = url.match(/v=([^&]+)/)?.[1] || '';
                        const watchUrl = `https://www.youtube.com/watch?v=${videoId}&t=${startSec}`;
                        
                        const card = document.createElement('div');
                        card.className = 'result-card p-4 rounded-md shadow-sm';
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-blue-400 font-semibold text-lg">${highlight(topic, terms)}</h3>
                                <span class="text-xs font-mono text-gray-500 bg-gray-800 px-2 py-1 rounded">${startTime}</span>
                            </div>
                            <p class="text-sm text-gray-300 mb-3">${highlight(summary, terms)}</p>
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500">${vTitle}</span>
                                <div class="flex gap-4">
                                    ${mode === 'vector' ? `<span class="text-green-600 font-mono">match: ${((1 - dist) * 100).toFixed(1)}%</span>` : ''}
                                    <a href="${watchUrl}" target="_blank" class="text-green-500 hover:underline">▶ Watch</a>
                                </div>
                            </div>
                        `;
                        resultsEl.appendChild(card);
                    });
                }

            } catch (err) {
                resultsEl.innerHTML = `<div class="p-4 bg-red-900/20 text-red-500 rounded border border-red-700">Error: ${err.message}</div>`;
            } finally {
                btnEl.disabled = false;
            }
        }

        queryEl.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
        btnEl.addEventListener('click', doSearch);

        init();
    </script>
</body>
</html>
